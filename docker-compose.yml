# d256 node. The image comes prebuilt from GitHub (ghcr.io); the node's state lives next to this file:
#   ./data  node key and certificate, sealed config cache and the offline traffic journal
#
# 1) In the panel: Nodes -> Add, copy the one-time token.
# 2) Enroll (once):  echo '<token>' | docker compose run --rm -T d256-node enroll https://panel.example.com -
# 3) Run:            docker compose up -d        Update: docker compose pull && docker compose up -d
# Host networking: Xray inbounds listen on the ports you configure in the panel, so open them in the firewall.
services:
  init:
    image: alpine:3.22
    restart: "no"
    network_mode: none
    command: chown -R 65532:65532 /var/lib/d256-node
    volumes:
      - ./data:/var/lib/d256-node

  d256-node:
    # A prebuilt image from GitHub Actions (linux/amd64 and linux/arm64): nothing is compiled on your server.
    # Pin a version with D256_NODE_TAG=v1.1.0 in .env; the default follows the latest release.
    image: ghcr.io/dest1256/d256-node:${D256_NODE_TAG:-latest}
    pull_policy: always
    container_name: d256-node
    restart: unless-stopped
    network_mode: host
    cap_add: [NET_BIND_SERVICE]
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ./data:/var/lib/d256-node
    environment:
      TZ: ${TZ:-UTC}
      D256_LOG_FORMAT: ${D256_LOG_FORMAT:-text}
