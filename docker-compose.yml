# d256 node. Built from GitHub (the node and the panel's proto module); the node's state lives next to this file:
#   ./data  node key and certificate, sealed config cache and the offline traffic journal
#
# 1) In the panel: Nodes -> Add, copy the one-time token.
# 2) Enroll (once):  echo '<token>' | docker compose run --rm -T d256-node enroll https://panel.example.com -
# 3) Run:            docker compose up -d --build        Update: the same command (pulls the latest source)
# Host networking: Xray inbounds listen on the ports you configure in the panel, so open them in the firewall.
services:
  init:
    image: alpine:3.22
    restart: "no"
    network_mode: none
    command: chown -R 65532:65532 /var/lib/d256-node
    volumes:
      - ./data:/var/lib/d256-node

  d256-node:
    build:
      # Use a tag or branch after '#', e.g. ...d256-node.git#v1.0.0
      context: ${D256_NODE_SRC:-https://github.com/dest1256/d256-node.git#main}
      additional_contexts:
        panel: ${D256_PANEL_SRC:-https://github.com/dest1256/d256-panel.git#main}
    image: d256-node:latest
    container_name: d256-node
    restart: unless-stopped
    network_mode: host
    cap_add: [NET_BIND_SERVICE]
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ./data:/var/lib/d256-node
    environment:
      TZ: ${TZ:-UTC}
      D256_LOG_FORMAT: ${D256_LOG_FORMAT:-text}
